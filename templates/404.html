{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | SWAT AUTO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a2d4a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
            overflow: hidden;
        }
        .error-container {
            text-align: center;
            max-width: 600px;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.8s ease-out;
        }
        .error-code {
            font-size: 12rem;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #e53935, #ff6f00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            text-shadow: 0 0 80px rgba(229, 57, 53, 0.3);
            animation: float 3s ease-in-out infinite;
        }
        .error-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 16px;
        }
        .error-message {
            font-size: 1.15rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 32px;
            line-height: 1.7;
        }
        .error-icon {
            font-size: 5rem;
            color: #e53935;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 14px 32px;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, #e53935, #ff6f00);
            color: white;
            border: none;
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(229, 57, 53, 0.4);
            color: white;
        }
        .btn-outline {
            background: transparent;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: white;
            color: white;
        }
        
        /* Background decoration */
        .bg-decoration {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            pointer-events: none;
        }
        .bg-decoration.one {
            width: 500px;
            height: 500px;
            background: #e53935;
            top: -200px;
            right: -200px;
        }
        .bg-decoration.two {
            width: 400px;
            height: 400px;
            background: #ff6f00;
            bottom: -200px;
            left: -200px;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        @media (max-width: 768px) {
            .error-code { font-size: 7rem; }
            .error-title { font-size: 1.8rem; }
            .error-message { font-size: 1rem; }
            .error-icon { font-size: 3.5rem; }
        }
    </style>
</head>
<body>
    <div class="bg-decoration one"></div>
    <div class="bg-decoration two"></div>
    
    <div class="error-container">
        <i class="bi bi-compass error-icon"></i>
        <div class="error-code">404</div>
        <h1 class="error-title">Lost on the Road?</h1>
        <p class="error-message">
            The page you're looking for doesn't exist. It might have been moved, deleted, or you took a wrong turn.
        </p>
        <div class="error-actions">
            <a href="/" class="btn btn-primary">
                <i class="bi bi-house-fill"></i> Back to Home
            </a>
            <a href="/cars/" class="btn btn-outline">
                <i class="bi bi-car-front-fill"></i> Browse Cars
            </a>
        </div>
    </div>
</body>
</html>
